[project]
name = "sokoban-fess"
version = "0.1.0"
description = "Educational Feature Space Search (FESS) Sokoban solver"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Alex Kubiesa", email = "alex.kubiesa@outlook.com" },
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26.0",
]

[project.optional-dependencies]
play = [
    "pygame>=2.5.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-timeout>=2.3.0",
]

[project.scripts]
sokoban-fess = "sokoban_fess.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sokoban_fess"]

[tool.hatch.build.targets.sdist]
include = ["src/sokoban_fess", "tests", "docs", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
timeout = 120

[tool.uv]
package = true
